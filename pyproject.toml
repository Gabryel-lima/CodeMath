[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codemath"
version = "0.2.0"
description = "Traduz programas Python para semântica denotacional (LaTeX, Unicode, JSON) e confere a tradução executando-a."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []   # só a biblioteca padrão

[project.scripts]
codemath = "codemath.cli:main"

[tool.setuptools.packages.find]
include = ["codemath*"]
